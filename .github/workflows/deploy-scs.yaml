name: Render Markdown as a static site and deploy via SCP to CMU servers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install marked dompurify jsdom js-yaml
      - name: Create output directory
        run: mkdir -p _site
      - name: Convert markdown to HTML
        run: node .render/render.js
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-artifact
          path: _site

  deploy-scs:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: my-artifact
          path: distfiles

      - name: Trust CMU SSH host
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SCS_HOSTNAME }} >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Deploy via rsync (replace contents of www)
        run: |
          sshpass -p "${{ secrets.CHRIS_SCS_PASSWORD }}" \
            rsync -av --delete \
              --no-perms \
              --no-times \
              --no-owner \
              --no-group \
              distfiles/ \
              ${{ secrets.CHRIS_SCS_USERNAME }}@${{ secrets.SCS_HOSTNAME }}:${{ secrets.SCS_DEPLOY_DIR }}/www/
